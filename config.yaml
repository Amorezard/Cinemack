# Movie Buff settings.
#
# Each key is the name of an environment variable the code reads. A variable set in the shell
# wins over this file, so one-off experiments still work the old way:
#     RERANK_N=30 python stage_scores.py --split tune --tag try30
# `python mb.py settings` shows every value in effect and where it came from.
# `python mb.py check` checks that the models, databases and vector cache match these settings.
#
# The values below are the settings locked on 29-30 Sep 2026 (experiments E1-E9), identical to
# the defaults written in the code. Change them here, not in the code.

models:
  ANSWER_MODEL: movie-buff          # writes answers, guesses titles, re-ranks (Ollama model name)
  # QUERY_MODEL: movie-buff         # reads the question first; defaults to ANSWER_MODEL
  EMBED_MODEL: mxbai-embed-large    # must be the model that built the vectors (mb.py check)
  ROUTE_MODEL: llama3.2             # only used when PLAN_ROUTE=1
  KEEP_ALIVE: 30m                   # how long Ollama keeps the models loaded after a question

search:
  WIKI: 1                           # search Wikipedia passages (E1)
  WIKI_KW: 1                        # keyword search over Wikipedia text
  WIKI_KINDS: plot,lead             # passage kinds searched by vector
  WIKI_Q: rrf                       # generated descriptions as their own ranked list (E3)
  WIKI_QSTYLES: short,scene,fuzzy,childhood
  WIKI_EXACT: 0
  WIKI_PASSAGE_FAST: 1
  HYDE: 1                           # planner writes a guessed plot to search with (E3)
  HYBRID: 1                         # keyword search over TMDB records
  VEC_MEM: 1                        # in-memory vector search, same results, ~7x faster (E9)
  WIKI_PER_FILM: 4                  # passages fetched per film wanted, per kind (E10: 8 with plot_s)
  DETAILS: 0                        # search each remembered detail separately: 0, split, llm (E11)

planner:
  PLAN_FAST: 1                      # shorter planner output (E6)
  PLAN_ROUTE: 0                     # two-step planner: lost 1 tune + 2 check, slower (E9)
  NUM_BATCH: 0                      # 0 = Ollama default (E8)

rerank:
  RERANK: auto                      # 1 = always, 0 = never, auto = skip when the search is sure (E5)
  RERANK_AGREE: 1
  RERANK_GAP: 0.03
  RERANK_ENGINE: llm                # the chat model re-ranks (cross-encoders lost, E6/E9)
  RERANK_TEXT: wiki                 # re-ranker reads the Wikipedia passage (E4)
  RERANK_WIKI_CHARS: 400
  RERANK_N: 50                      # films shown to the re-ranker (E7, E9: trims all lost)
  RERANK_SECOND: 0                  # (E8)
  RERANK_WIN: 0                     # which 400 chars of the passage it reads: 0 first, kw, emb (E10)

answers:
  ANSWER_WIKI: 1                    # answer prompt includes Wikipedia details (E5 judge)
  ANSWER_WIKI_CHARS: 700
  ANSWER_STRICT: 0                  # (E8)
  ANSWER_STYLE: 0

v3:
  # Each v3 switch is off until its run says otherwise (decision rules in run_v3a.sh / run_v3b.sh).
  # 8 Oct: set to the values the sealed v3 run used (run_final_v3.sh V3_ENV).
  CONV: 1                           # conversation-aware planner (conv.py); run_v3a.sh: multiturn 19 -> 26/30, ADOPTED
  TOOLS: 1                          # router + structured tools + analysis answers (tools.py); v3.1b lock, ADOPTED
  PERSONAL: 1                       # taste profile + explained recommendations (personal.py); run_v3d.sh sweep, ADOPTED
  PERSONAL_W: "0.25,2,0.5"          # content, neighbours, popularity weights (personal.py sweep)
  PARALLEL: 1                       # question-only searches during planning (same results); 15 Oct: ON for the demo (gain within noise, not by rule)
  # RERANK_MODEL: movie-buff        # re-ranker model; default = ANSWER_MODEL; run_v3b.sh tries smaller ones
  SPEC_MODEL: llama3.2              # fills the query spec for ranking/trend/career questions (TOOLS=1)
  TOOL_CHARS: 9000                  # all tool blocks together, ~2.3k tokens of the 8k context
  HISTORY_CHARS: 6000               # website: conversation history sent to the answer model

v4:
  # 14 Oct, GPU free again. Each switch stays off until its run_v4.sh rule passes (rules at the top of run_v4.sh).
  NEWS: 0                           # 11 Nov OFF (round 27, decided by its rule: news at release never beat the model without it - pf4 -0.004 [-0.012, +0.004]; was ON since 15 Oct by choice). Set 1 to bring back news lines in news and "why" answers
  SUCCESS: 1                        # 15 Oct ON (user choice, rule not passed): fixed success measures vs films of the same genre and year (tools.success_block)
  ROUTE_FIX: 1                      # 15 Oct ON (user choice, rule not passed): comparison wording finds both films (sealed set: compare route 0/3)
  WIKI_CTX_KW: 0                    # keyword list over contextual chunks (chunk_context.py fts)
  # WIKI_KINDS: plot_c,lead_c       # contextual chunk vectors (chunk_context.py); set in search: if adopted
  REVIEW_FILTER: 1                  # review analysis uses only reviews review_filter.py marks usable
  ALIASES: 1                        # 15 Oct ON (user choice; test set unmeasured): nicknames / abbreviations expanded before search (aliases.py build first)
  DYM: 1                            # 15 Oct ON (untested on real data): "did you mean": two close films for a description -> answer + ask
  SPOILERS: 1                       # 15 Oct ON (untested on real data): keep endings and twists out unless the question asks for them
  WIKI_CREDIT: 1                    # 15 Oct ON (untested on real data): website appends Wikipedia links + CC BY-SA credit after the answer
  # MOCK: off                       # off | fake | replay | record (mock_llm.py); leave off on the server
  # The adapter rebuild (rebuild_adapter.sh) does not change this file: a promoted adapter is named in
  # live_model.yaml (ANSWER_MODEL), which overrides the ANSWER_MODEL above.

v5:
  # 15 Oct evening. Off until run_v5.sh's rules pass (rules at the top of run_v5.sh).
  PERF: 0                           # box-office model block (performance.py fit) for why / hit-or-flop questions
  CRITIC_SCORES: 1                  # Rotten Tomatoes / Metacritic / CinemaScore numbers (money_extra.py critics)
  MONEY_REAL: 1                     # budget and gross in today's dollars (money_extra.py real)
